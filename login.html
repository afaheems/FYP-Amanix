<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amanix - Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #e7e9ea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: #1a1a1a;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      border: 1px solid #2f2f2f;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .logo-section { text-align: center; margin-bottom: 32px; }
    .logo {
      font-size: 28px; font-weight: bold; color: #ffffff;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-img { width: 48px; height: 48px; margin-right: 10px; border-radius: 10px; object-fit: contain; }
    .logo span { color: #7c3aed; }
    .tagline { color: #71767b; font-size: 14px; margin-top: 8px; }

    .auth-tabs {
      display: flex; gap: 4px; margin-bottom: 24px;
      background: #0a0a0a; padding: 4px; border-radius: 12px;
    }
    .auth-tab {
      flex: 1; padding: 10px; border-radius: 10px; border: none;
      background: transparent; color: #71767b; font-size: 14px;
      font-weight: 500; cursor: pointer; font-family: inherit;
    }
    .auth-tab.active { background: #7c3aed; color: white; }

    .role-selector { display: flex; gap: 12px; margin-bottom: 20px; }
    .role-btn {
      flex: 1; padding: 12px 16px; border-radius: 12px;
      border: 2px solid #2f2f2f; background: transparent;
      color: #e7e9ea; text-align: center; cursor: pointer;
      font-size: 14px; font-weight: 500; font-family: inherit;
      user-select: none;
    }
    .role-btn .role-label {
      display: block; font-size: 11px; color: #71767b;
      font-weight: normal; margin-top: 2px;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #e7e9ea; }
    .form-group input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid #2f2f2f; background: #0a0a0a;
      color: #e7e9ea; font-size: 14px; font-family: inherit;
    }
    .form-group input:focus { outline: none; border-color: #7c3aed; }
    .form-group input::placeholder { color: #4f4f4f; }

    .message { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
    .message.error { display: block; background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid #ef4444; }
    .message.success { display: block; background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid #10b981; }

    .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; }
    .form-options label { display: flex; align-items: center; gap: 8px; color: #71767b; cursor: pointer; }
    .form-options label input[type="checkbox"] { accent-color: #7c3aed; width: 16px; height: 16px; }
    .form-options a { color: #7c3aed; text-decoration: none; }

    .signin-btn {
      width: 100%; padding: 14px; border-radius: 30px; border: none;
      background: #7c3aed; color: white; font-size: 16px; font-weight: bold;
      cursor: pointer; font-family: inherit;
    }
    .signin-btn:hover { background: #6d28d9; }

    .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #4f4f4f; }
    .footer a { color: #71767b; text-decoration: none; }
    .divider { border: none; border-top: 1px solid #2f2f2f; margin: 20px 0; }

    #signupSection { display: none; }
    #signinSection { display: block; }
  </style>
</head>

<body>

<div class="login-container">

  <div class="logo-section">
    <div class="logo">
      <img src="amanix_logo.png" alt="Amanix Logo" class="logo-img" onerror="this.style.display='none'" />
      Aman<span>ix</span>
    </div>
    <div class="tagline">Educational browser extension for teen social media safety</div>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" id="signinTab" type="button">Sign In</button>
    <button class="auth-tab" id="signupTab" type="button">Sign Up</button>
  </div>

  <div class="message" id="messageBox"></div>

  <div id="signinSection">
    <div class="role-selector" id="roleSelector">
      <div class="role-btn" id="userRole" style="border-color: #7c3aed; background: rgba(124,58,237,0.15); color: #ffffff;">
        👤 User
        <span class="role-label">(Teen)</span>
      </div>
      <div class="role-btn" id="adminRole" style="border-color: #2f2f2f; background: transparent; color: #e7e9ea;">
        ⚙️ Admin
        <span class="role-label">(Supervisor)</span>
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="demo or admin" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="********" autocomplete="current-password" />
      </div>
      <div class="form-options">
        <label><input type="checkbox" id="rememberMe" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="signin-btn" id="signinBtn">Sign in as User</button>
    </form>
  </div>

  <div id="signupSection">
    <form id="signupForm">
      <div class="form-group">
        <label for="signupName">Full name</label>
        <input type="text" id="signupName" placeholder="Muhammad Haziq" />
      </div>
      <div class="form-group">
        <label for="signupUsername">Username</label>
        <input type="text" id="signupUsername" placeholder="haziq_amanix" />
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="At least 6 characters" />
      </div>
      <div class="form-group">
        <label for="signupConfirm">Confirm password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter password" />
      </div>
      <button type="submit" class="signin-btn">Create account</button>
    </form>
  </div>

  <hr class="divider" />

  <div class="footer">
    © 2025 Amanix &bull; <a href="#">Privacy</a> &bull; <a href="#">Terms</a>
    <br />
    <span style="color: #4f4f4f; font-size: 10px;">Project 17038D — IIUM</span>
  </div>

</div>

<!-- ===== EXTERNAL SCRIPT (CSP-COMPLIANT) ===== -->
<script src="login.js"></script>

</body>
</html>
